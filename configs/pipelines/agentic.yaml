# Agentic RAG — LangGraph self-correcting loop:
#   plan -> retrieve -> grade -> (rewrite/retry)* -> generate -> critic -> cite
collection: raglab_demo
architecture: agentic_rag

embedding:
  name: hashing
  dim: 384

vectorstore:
  name: qdrant
  location: ":memory:"
  distance: cosine

retrieval:
  type: hybrid
  dense_k: 20
  bm25_k: 20
  fusion: rrf
  rrf_k: 60
  k: 6

reranker:
  name: noop
  top_n: 5

llm:
  # For a real agentic loop swap to a chat provider, e.g.
  #   provider: openrouter   model: deepseek/deepseek-chat
  #   provider: openai       model: gpt-4o-mini
  #   provider: gemini       model: gemini-2.5-flash
  provider: echo
  temperature: 0.0
  max_tokens: 768

# Agentic self-correction controls.
agent:
  max_retrieval_retries: 2
  grade_threshold: 0.6
  enable_critic: true

observability:
  langfuse: false
  langsmith: false
